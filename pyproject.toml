[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-seo-crawler"
version = "1.0.0"
description = "A lightweight technical SEO crawler that audits a website and exports CSV/Excel reports."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Anuj" }]
keywords = ["seo", "crawler", "technical-seo", "site-audit", "web-scraping"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0"]

[project.scripts]
seo-crawler = "seo_crawler.cli:main"

[tool.setuptools.packages.find]
include = ["seo_crawler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
